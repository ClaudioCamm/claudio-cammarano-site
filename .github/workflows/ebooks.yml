# PDF ed ePub dei saggi lunghi (audit 2026, L6).
# A ogni push su main che tocca i saggi o gli script, rigenera con Pandoc i
# file dei saggi cambiati (>= 15 minuti di lettura) e li committa in
# src/downloads/saggi/. Netlify pubblica poi il nuovo commit.
name: PDF ed ePub dei saggi

on:
  push:
    branches: [main]
    paths:
      - "src/writings/**"
      - "src/curated/**"
      - "scripts/ebooks/**"
      - ".github/workflows/ebooks.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rigenera tutti i file"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ebooks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pandoc e XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-lang-italian lmodern fonts-lmodern

      - name: Source Serif 4 (Adobe, SIL OFL)
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sSL -o /tmp/ss4.zip https://github.com/adobe-fonts/source-serif/releases/download/4.005R/source-serif-4.005_Desktop.zip
          echo "549fdb8f9a682bd06944298621404969f6de77c2e422ff3b8244a1dcd6a0c425  /tmp/ss4.zip" | sha256sum -c -
          unzip -q -j /tmp/ss4.zip '*/OTF/*.otf' -d ~/.local/share/fonts
          fc-cache -f
          fc-list | grep -c "Source Serif 4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # build.py legge il frontmatter con gray-matter, lo stesso parser del
      # sito: i PDF vedono esattamente quello che vede Eleventy.
      - name: Dipendenze Node
        run: npm ci

      - name: Genera PDF ed ePub
        run: python3 scripts/ebooks/build.py ${{ inputs.force && '--force' || '' }}

      - name: Commit dei file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/downloads/saggi
          if git diff --cached --quiet; then
            echo "Nessun file nuovo."
          else
            git commit -m "PDF ed ePub dei saggi aggiornati"
            git push
          fi
