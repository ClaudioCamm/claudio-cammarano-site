# Audit sicurezza 2026-11: aggiornamenti proposti come pull request,
# da approvare a mano. Nulla viene unito in automatico.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
