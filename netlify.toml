[build]
  command = "npm run build"
  publish = "_site"

# Immagini, font e asset statici — cache aggressiva (1 anno)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML — rivalidato ad ogni richiesta
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ------------------------------------------------------------------
# Redirect 301 — vecchi permalink Medium (dominio custom dell'epoca)
# che oggi finiscono sul 404. I post vivono su medium.com/@ClaudioCamm
# ("The Abstract Archives 2018–2025"); Medium risolve via ID finale.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# Lab: la sezione di ricerca esce da /episteme-advisory/ e va in root.
# Il feed ha una regola propria, prima dello splat, perché i lettori RSS
# risolvono l'URL esatto e non seguirebbero un catch-all sbagliato.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# Download del programma di ricerca: i tre PDF hanno nomi leggibili
# una volta salvati sul desktop di un lettore. I vecchi percorsi
# restano validi perche' sono gia' circolati per link.
# ------------------------------------------------------------------

[[redirects]]
  from = "/downloads/11_2026_academic_v6.pdf"
  to = "/downloads/cammarano-post-cognitive-validation-v6.pdf"
  status = 301

